name: voice_translate
description: "Real-time accessibility translation app - listens to spoken language and translates to your preferred language with audio and text output."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Speech Recognition (On-Device)
  speech_to_text: ^7.0.0

  # Translation
  http: ^1.2.0
  translator: ^1.0.0

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # State Management
  provider: ^6.1.0

  # Audio Management
  audio_session: ^0.1.21

  # Storage & Config
  shared_preferences: ^2.3.0

  # Permissions
  permission_handler: ^11.3.0

  # Background execution
  flutter_background_service: ^5.0.0

  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
